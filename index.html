<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="OAT De Excelsior - Quality electronics and fashion products in Ijoko, Ogun State" />
  <meta name="theme-color" content="#000000" />
  <title>OAT De Excelsior</title>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      transition: opacity 0.5s ease;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      animation: breathe 2s ease-in-out infinite;
    }
    #splash .ring {
      position: absolute;
      width: 160px;
      height: 160px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
    }
    #splash .logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #splash p {
      margin-top: 32px;
      color: #9ca3af;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.97); }
    }
  </style>
</head>

<body>
  <div id="splash">
    <div class="logo-wrap">
      <div class="ring"></div>
      <img src="/logo.jpg" alt="OAT De Excelsior" />
    </div>
    <p>Quality you can trust. Style you deserve.</p>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
